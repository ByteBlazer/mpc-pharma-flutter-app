name: Build and deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.5'
  APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
  REMOTE_RELEASE_DIR: /var/tmp/mpc-pharma-web-${{ github.ref_name }}

jobs:
  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    env:
      BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
      DEPLOY_DOMAIN: ${{ github.ref_name == 'main' && secrets.DOMAIN_NAME || format('staging.{0}', secrets.DOMAIN_NAME) }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ubuntu' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          test -n "${EC2_HOST}" || (echo "Missing required GitHub secret: EC2_HOST" && exit 1)
          test -n "${EC2_SSH_PRIVATE_KEY}" || (echo "Missing required GitHub secret: EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "${EC2_USER}" || (echo "EC2_USER resolved to empty. Set EC2_USER secret or use an Ubuntu AMI with user ubuntu." && exit 1)
          echo "Required deployment secrets are present."

      - name: Print deployment context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          echo "Base domain: ${BASE_DOMAIN}"
          echo "Deploy domain: ${DEPLOY_DOMAIN}"
          echo "EC2 user: ${EC2_USER}"
          echo "Remote release directory: ${REMOTE_RELEASE_DIR}"
          echo "EC2 host configured: true"
          echo "EC2 SSH key configured: true"

      - name: Patch environment file
        run: |
          set -euxo pipefail
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"

      - name: Stamp build timestamp
        run: |
          set -euxo pipefail
          BUILD_STAMP="$(TZ=Asia/Kolkata date +'%d-%m-%Y %I:%M %p IST')"
          printf '%s\n' "${BUILD_STAMP}" > BUILD_TIMESTAMP
          echo "BUILD_TIMESTAMP set to:"
          cat BUILD_TIMESTAMP

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Analyze
        run: |
          set -euxo pipefail
          flutter analyze

      - name: Test
        run: |
          set -euxo pipefail
          flutter test

      - name: Build web bundle
        run: |
          set -euxo pipefail
          echo "Building web bundle for APP_ENV=${APP_ENV}"
          echo "Build timestamp file:"
          cat BUILD_TIMESTAMP
          flutter build web --release --base-href=/ --dart-define=APP_ENV=${APP_ENV}
          echo "Web build output:"
          du -sh build/web
          find build/web -maxdepth 2 -type f | sort | sed 's#^#  #'

      - name: Configure SSH
        run: |
          set -euxo pipefail
          echo "Preparing SSH configuration for EC2 deployment"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          echo "SSH known_hosts configured"

      - name: Bootstrap EC2 web server
        run: |
          set -euxo pipefail
          echo "Bootstrapping fresh EC2 instance for DOMAIN_NAME=${BASE_DOMAIN}"
          ssh -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euxo pipefail
          echo "Remote host: \$(hostname)"
          echo "Installing Nginx and rsync if needed"
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync
          echo "Creating web roots"
          sudo mkdir -p "/var/www/${BASE_DOMAIN}"
          sudo mkdir -p "/var/www/staging.${BASE_DOMAIN}"
          echo "Removing default Nginx site if present"
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo rm -f /etc/nginx/sites-available/default
          echo "Writing managed Nginx config"
          sudo tee /etc/nginx/conf.d/mpc-pharma-web.conf > /dev/null <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              location = / {
                  add_header Content-Type text/plain;
                  return 200 "ok\n";
              }
          }

          server {
              listen 80;
              server_name DOMAIN_NAME_PLACEHOLDER www.DOMAIN_NAME_PLACEHOLDER;

              root /var/www/DOMAIN_NAME_PLACEHOLDER;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:3001;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$http_x_forwarded_proto;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300;
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }

          server {
              listen 80;
              server_name staging.DOMAIN_NAME_PLACEHOLDER;

              root /var/www/staging.DOMAIN_NAME_PLACEHOLDER;
              index index.html;

              location /api/ {
                  proxy_pass http://127.0.0.1:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$http_x_forwarded_proto;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 300;
              }

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          NGINX
          sudo sed -i "s/DOMAIN_NAME_PLACEHOLDER/${BASE_DOMAIN}/g" /etc/nginx/conf.d/mpc-pharma-web.conf
          echo "Managed Nginx config:"
          sudo cat /etc/nginx/conf.d/mpc-pharma-web.conf
          echo "Validating and enabling Nginx"
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl reload nginx || sudo systemctl restart nginx
          EOF

      - name: Upload web bundle to EC2
        run: |
          set -euxo pipefail
          echo "Uploading build/web to ${EC2_USER}@${EC2_HOST}:${REMOTE_RELEASE_DIR}/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            build/web/ \
            "${EC2_USER}@${EC2_HOST}:${REMOTE_RELEASE_DIR}/"
          echo "Upload completed"

      - name: Publish web bundle through Nginx
        run: |
          set -euxo pipefail
          echo "Publishing ${REMOTE_RELEASE_DIR} to /var/www/${DEPLOY_DOMAIN}"
          ssh -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euxo pipefail
          echo "Remote host: \$(hostname)"
          echo "Creating web root /var/www/${DEPLOY_DOMAIN}"
          sudo mkdir -p "/var/www/${DEPLOY_DOMAIN}"
          echo "Syncing release directory into Nginx web root"
          sudo rsync -a --delete "${REMOTE_RELEASE_DIR}/" "/var/www/${DEPLOY_DOMAIN}/"
          echo "Setting web root ownership"
          sudo chown -R www-data:www-data "/var/www/${DEPLOY_DOMAIN}"
          echo "Validating Nginx configuration"
          sudo nginx -t
          echo "Reloading Nginx"
          sudo systemctl reload nginx
          echo "Published /var/www/${DEPLOY_DOMAIN}"
          EOF

      - name: Web deployment diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "Web deployment job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "Deploy domain: ${DEPLOY_DOMAIN}"
          echo "Remote release directory: ${REMOTE_RELEASE_DIR}"
          echo "Local build/web listing, if present:"
          ls -la build || true
          ls -la build/web || true
          echo "Disk usage:"
          df -h || true

  package-android:
    name: Package Android app
    runs-on: ubuntu-latest
    needs: deploy-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Android packaging context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          echo "Production signing expected: ${{ github.ref_name == 'main' }}"

      - name: Patch environment file
        env:
          BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euxo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"


      - name: Stamp build timestamp
        run: |
          set -euxo pipefail
          BUILD_STAMP="$(TZ=Asia/Kolkata date +'%d-%m-%Y %I:%M %p IST')"
          printf '%s\n' "${BUILD_STAMP}" > BUILD_TIMESTAMP
          echo "BUILD_TIMESTAMP set to:"
          cat BUILD_TIMESTAMP

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          flutter pub get

      - name: Decode production Android signing keystore
        if: github.ref_name == 'main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euxo pipefail
          echo "Checking Android signing secrets"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          echo "Decoding Android upload keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -l android/app/upload-keystore.jks
          {
            echo "ANDROID_KEYSTORE_PATH=upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Android signing environment configured"

      - name: Build staging debug APK
        if: github.ref_name == 'staging'
        run: |
          set -euxo pipefail
          echo "Build timestamp file:"
          cat BUILD_TIMESTAMP
          flutter build apk --debug --dart-define=APP_ENV=staging
          ls -lh build/app/outputs/flutter-apk/

      - name: Build production release APK
        if: github.ref_name == 'main'
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=APP_ENV=production
          ls -lh build/app/outputs/flutter-apk/

      - name: Build production app bundle
        if: github.ref_name == 'main'
        run: |
          set -euxo pipefail
          flutter build appbundle --release --dart-define=APP_ENV=production
          ls -lh build/app/outputs/bundle/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Android packaging diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "Android packaging job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "Android output directories:"
          find build/app/outputs -maxdepth 4 -type f -print || true
          echo "Gradle reports:"
          find android -path '*reports*' -type f -print || true
          echo "Disk usage:"
          df -h || true

  package-ios:
    name: Package iOS app
    runs-on: macos-latest
    needs: deploy-web
    env:
      IOS_IS_PRODUCTION: ${{ github.ref_name == 'main' }}
      IOS_BUNDLE_ID: ${{ github.ref_name == 'main' && 'com.mpc.pharma.mpcPharma' || 'com.mpc.pharma.mpcPharma.staging' }}
      IOS_FLAVOR: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      IOS_DART_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print iOS packaging context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          echo "iOS flavor: ${IOS_FLAVOR}"
          echo "iOS bundle id: ${IOS_BUNDLE_ID}"
          sw_vers
          xcodebuild -version

      - name: Validate Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_STAGING_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_STAGING_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${APPLE_TEAM_ID}" || (echo "Missing secret: APPLE_TEAM_ID" && exit 1)
          test -n "${APPLE_CERTIFICATE_BASE64}" || (echo "Missing secret: APPLE_CERTIFICATE_BASE64" && exit 1)
          test -n "${APPLE_CERTIFICATE_PASSWORD}" || (echo "Missing secret: APPLE_CERTIFICATE_PASSWORD" && exit 1)
          test -n "${APP_STORE_CONNECT_API_KEY_ID}" || (echo "Missing secret: APP_STORE_CONNECT_API_KEY_ID" && exit 1)
          test -n "${APP_STORE_CONNECT_ISSUER_ID}" || (echo "Missing secret: APP_STORE_CONNECT_ISSUER_ID" && exit 1)
          test -n "${APP_STORE_CONNECT_API_KEY_BASE64}" || (echo "Missing secret: APP_STORE_CONNECT_API_KEY_BASE64" && exit 1)
          if [ "${IOS_IS_PRODUCTION}" = "true" ]; then
            test -n "${APPLE_PROVISIONING_PROFILE_BASE64}" || (echo "Missing secret: APPLE_PROVISIONING_PROFILE_BASE64" && exit 1)
          else
            test -n "${APPLE_PROVISIONING_PROFILE_STAGING_BASE64}" || (echo "Missing secret: APPLE_PROVISIONING_PROFILE_STAGING_BASE64" && exit 1)
          fi
          echo "Apple signing secrets are present for ${IOS_FLAVOR}."

      - name: Patch environment file
        env:
          BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euxo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"

      - name: Stamp build timestamp
        run: |
          set -euxo pipefail
          BUILD_STAMP="$(TZ=Asia/Kolkata date +'%d-%m-%Y %I:%M %p IST')"
          printf '%s\n' "${BUILD_STAMP}" > BUILD_TIMESTAMP
          echo "BUILD_TIMESTAMP set to:"
          cat BUILD_TIMESTAMP

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Apply iOS flavor (bundle id + display name)
        run: |
          set -euxo pipefail
          chmod +x tool/prepare_ios_flavor.sh
          tool/prepare_ios_flavor.sh "${IOS_FLAVOR}"

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile and prepare export options
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_PROVISIONING_PROFILE_STAGING_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_STAGING_BASE64 }}
        run: |
          set -euxo pipefail
          if [ "${IOS_IS_PRODUCTION}" = "true" ]; then
            PROFILE_B64="${APPLE_PROVISIONING_PROFILE_BASE64}"
          else
            PROFILE_B64="${APPLE_PROVISIONING_PROFILE_STAGING_BASE64}"
          fi

          PROFILE_PATH="$RUNNER_TEMP/appstore.mobileprovision"
          echo -n "${PROFILE_B64}" | base64 --decode > "${PROFILE_PATH}"

          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          security cms -D -i "${PROFILE_PATH}" > "${PROFILE_PLIST}"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "${PROFILE_PLIST}")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "${PROFILE_PLIST}")"
          echo "Provisioning profile UUID: ${PROFILE_UUID}"
          echo "Provisioning profile name: ${PROFILE_NAME}"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "${PROFILE_PATH}" "$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"

          export BUNDLE_ID="${IOS_BUNDLE_ID}"
          export PROFILE_NAME APPLE_TEAM_ID
          python3 - <<'PY'
          import os
          from pathlib import Path
          team = os.environ["APPLE_TEAM_ID"]
          bundle = os.environ["BUNDLE_ID"]
          profile = os.environ["PROFILE_NAME"]
          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '  <key>method</key>',
              '  <string>app-store-connect</string>',
              '  <key>teamID</key>',
              f'  <string>{team}</string>',
              '  <key>signingStyle</key>',
              '  <string>manual</string>',
              '  <key>signingCertificate</key>',
              '  <string>Apple Distribution</string>',
              '  <key>provisioningProfiles</key>',
              '  <dict>',
              f'    <key>{bundle}</key>',
              f'    <string>{profile}</string>',
              '  </dict>',
              '  <key>uploadSymbols</key>',
              '  <true/>',
              '</dict>',
              '</plist>',
              '',
          ]
          Path("ios/ExportOptions.plist").write_text("\n".join(lines))
          PY

          # Force manual signing for CI (project defaults to Automatic).
          sed -i '' "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY\[sdk=iphoneos\*\] = "iPhone Developer";/CODE_SIGN_IDENTITY[sdk=iphoneos*] = "Apple Distribution";/g' ios/Runner.xcodeproj/project.pbxproj

          if ! grep -q '^DEVELOPMENT_TEAM=' ios/Flutter/Release.xcconfig; then
            echo "DEVELOPMENT_TEAM=${APPLE_TEAM_ID}" >> ios/Flutter/Release.xcconfig
          fi
          if ! grep -q '^CODE_SIGN_STYLE=' ios/Flutter/Release.xcconfig; then
            echo "CODE_SIGN_STYLE=Manual" >> ios/Flutter/Release.xcconfig
          fi
          if ! grep -q '^PROVISIONING_PROFILE_SPECIFIER=' ios/Flutter/Release.xcconfig; then
            echo "PROVISIONING_PROFILE_SPECIFIER=${PROFILE_NAME}" >> ios/Flutter/Release.xcconfig
          fi
          if ! grep -q '^CODE_SIGN_IDENTITY=' ios/Flutter/Release.xcconfig; then
            echo 'CODE_SIGN_IDENTITY=Apple Distribution' >> ios/Flutter/Release.xcconfig
          fi

          cat ios/ExportOptions.plist
          cat ios/Flutter/Release.xcconfig

      - name: Write Google Maps iOS API key
        run: |
          set -euxo pipefail
          ENV_FILE="env/${APP_ENV}.env"
          test -f "${ENV_FILE}"
          KEY="$(grep -E '^GOOGLE_MAP_API_KEY=' "${ENV_FILE}" | head -n 1 | cut -d= -f2- | tr -d '\r')"
          if [ -z "${KEY}" ]; then
            echo "GOOGLE_MAP_API_KEY is empty in ${ENV_FILE}"
            exit 1
          fi
          printf 'GOOGLE_MAPS_API_KEY=%s\n' "${KEY}" > ios/Flutter/GoogleMaps.xcconfig
          echo "Wrote ios/Flutter/GoogleMaps.xcconfig for APP_ENV=${APP_ENV} (key length=${#KEY})"

      - name: Build signed IPA
        run: |
          set -euxo pipefail
          echo "Build timestamp file:"
          cat BUILD_TIMESTAMP
          test -f ios/Flutter/GoogleMaps.xcconfig
          grep -q '^GOOGLE_MAPS_API_KEY=.\+' ios/Flutter/GoogleMaps.xcconfig
          flutter build ipa --release \
            --dart-define=APP_ENV="${IOS_DART_ENV}" \
            --export-options-plist=ios/ExportOptions.plist
          ls -lh build/ios/ipa/

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.ref_name }}-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

      - name: Upload IPA to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euxo pipefail
          IPA_PATH="$(ls build/ios/ipa/*.ipa | head -n 1)"
          test -n "${IPA_PATH}"
          echo "Uploading ${IPA_PATH} (${IOS_FLAVOR} / ${IOS_BUNDLE_ID})"

          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "${API_KEY_DIR}"
          echo -n "${APP_STORE_CONNECT_API_KEY_BASE64}" | base64 --decode \
            > "${API_KEY_DIR}/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"

          xcrun altool --upload-app \
            --type ios \
            --file "${IPA_PATH}" \
            --apiKey "${APP_STORE_CONNECT_API_KEY_ID}" \
            --apiIssuer "${APP_STORE_CONNECT_ISSUER_ID}"

      - name: iOS packaging diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "iOS packaging job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "iOS flavor: ${IOS_FLAVOR}"
          echo "iOS bundle id: ${IOS_BUNDLE_ID}"
          echo "iOS build outputs:"
          find build/ios -maxdepth 4 -type f -print || true
          echo "Xcode version:"
          xcodebuild -version || true
          echo "Disk usage:"
          df -h || true
