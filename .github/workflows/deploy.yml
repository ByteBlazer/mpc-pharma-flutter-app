name: Build and deploy

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.5'
  APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
  REMOTE_RELEASE_DIR: /tmp/mpc-pharma-web-${{ github.ref_name }}

jobs:
  deploy-web:
    name: Deploy web app
    runs-on: ubuntu-latest
    env:
      BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
      DEPLOY_DOMAIN: ${{ github.ref_name == 'main' && secrets.DOMAIN_NAME || format('staging.{0}', secrets.DOMAIN_NAME) }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER != '' && secrets.EC2_USER || 'ec2-user' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          test -n "${EC2_HOST}" || (echo "Missing required GitHub secret: EC2_HOST" && exit 1)
          test -n "${EC2_SSH_PRIVATE_KEY}" || (echo "Missing required GitHub secret: EC2_SSH_PRIVATE_KEY" && exit 1)
          test -n "${EC2_USER}" || (echo "EC2_USER resolved to empty. Set EC2_USER secret or use an Amazon Linux AMI with user ec2-user." && exit 1)
          echo "Required deployment secrets are present."

      - name: Print deployment context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          echo "Base domain: ${BASE_DOMAIN}"
          echo "Deploy domain: ${DEPLOY_DOMAIN}"
          echo "EC2 user: ${EC2_USER}"
          echo "Remote release directory: ${REMOTE_RELEASE_DIR}"
          echo "EC2 host configured: true"
          echo "EC2 SSH key configured: true"

      - name: Patch environment file
        run: |
          set -euxo pipefail
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Analyze
        run: |
          set -euxo pipefail
          flutter analyze

      - name: Test
        run: |
          set -euxo pipefail
          flutter test

      - name: Build web bundle
        run: |
          set -euxo pipefail
          echo "Building web bundle for APP_ENV=${APP_ENV}"
          flutter build web --release --base-href=/ --dart-define=APP_ENV=${APP_ENV}
          echo "Web build output:"
          du -sh build/web
          find build/web -maxdepth 2 -type f | sort | sed 's#^#  #'

      - name: Configure SSH
        run: |
          set -euxo pipefail
          echo "Preparing SSH configuration for EC2 deployment"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${EC2_HOST}" >> ~/.ssh/known_hosts
          echo "SSH known_hosts configured"

      - name: Bootstrap EC2 web server
        run: |
          set -euxo pipefail
          echo "Bootstrapping fresh EC2 instance for DOMAIN_NAME=${BASE_DOMAIN}"
          ssh -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euxo pipefail
          echo "Remote host: \$(hostname)"
          echo "Installing Nginx and rsync if needed"
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx rsync
          elif command -v dnf >/dev/null 2>&1; then
            sudo dnf install -y nginx rsync
          elif command -v yum >/dev/null 2>&1; then
            sudo yum install -y nginx rsync
          else
            echo "No supported package manager found. Expected apt-get, dnf, or yum."
            exit 1
          fi
          echo "Creating web roots"
          sudo mkdir -p "/var/www/${BASE_DOMAIN}"
          sudo mkdir -p "/var/www/staging.${BASE_DOMAIN}"
          echo "Removing default Nginx site if present"
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo rm -f /etc/nginx/sites-available/default
          echo "Writing managed Nginx config"
          sudo tee /etc/nginx/conf.d/mpc-pharma-web.conf > /dev/null <<'NGINX'
          server {
              listen 80 default_server;
              server_name _;

              location = / {
                  add_header Content-Type text/plain;
                  return 200 "ok\n";
              }
          }

          server {
              listen 80;
              server_name DOMAIN_NAME_PLACEHOLDER www.DOMAIN_NAME_PLACEHOLDER;

              root /var/www/DOMAIN_NAME_PLACEHOLDER;
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }

          server {
              listen 80;
              server_name staging.DOMAIN_NAME_PLACEHOLDER;

              root /var/www/staging.DOMAIN_NAME_PLACEHOLDER;
              index index.html;

              location / {
                  try_files \$uri \$uri/ /index.html;
              }
          }
          NGINX
          sudo sed -i "s/DOMAIN_NAME_PLACEHOLDER/${BASE_DOMAIN}/g" /etc/nginx/conf.d/mpc-pharma-web.conf
          echo "Managed Nginx config:"
          sudo cat /etc/nginx/conf.d/mpc-pharma-web.conf
          echo "Validating and enabling Nginx"
          sudo nginx -t
          sudo systemctl enable nginx
          sudo systemctl reload nginx || sudo systemctl restart nginx
          EOF

      - name: Upload web bundle to EC2
        run: |
          set -euxo pipefail
          echo "Uploading build/web to ${EC2_USER}@${EC2_HOST}:${REMOTE_RELEASE_DIR}/"
          rsync -az --delete \
            -e "ssh -i ~/.ssh/ec2_key" \
            build/web/ \
            "${EC2_USER}@${EC2_HOST}:${REMOTE_RELEASE_DIR}/"
          echo "Upload completed"

      - name: Publish web bundle through Nginx
        run: |
          set -euxo pipefail
          echo "Publishing ${REMOTE_RELEASE_DIR} to /var/www/${DEPLOY_DOMAIN}"
          ssh -i ~/.ssh/ec2_key "${EC2_USER}@${EC2_HOST}" <<EOF
          set -euxo pipefail
          echo "Remote host: \$(hostname)"
          echo "Creating web root /var/www/${DEPLOY_DOMAIN}"
          sudo mkdir -p "/var/www/${DEPLOY_DOMAIN}"
          echo "Syncing release directory into Nginx web root"
          sudo rsync -a --delete "${REMOTE_RELEASE_DIR}/" "/var/www/${DEPLOY_DOMAIN}/"
          echo "Setting web root ownership"
          if id www-data >/dev/null 2>&1; then
            sudo chown -R www-data:www-data "/var/www/${DEPLOY_DOMAIN}"
          elif id nginx >/dev/null 2>&1; then
            sudo chown -R nginx:nginx "/var/www/${DEPLOY_DOMAIN}"
          else
            echo "No www-data or nginx user found; leaving web root ownership unchanged"
          fi
          echo "Validating Nginx configuration"
          sudo nginx -t
          echo "Reloading Nginx"
          sudo systemctl reload nginx
          echo "Published /var/www/${DEPLOY_DOMAIN}"
          EOF

      - name: Web deployment diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "Web deployment job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "Deploy domain: ${DEPLOY_DOMAIN}"
          echo "Remote release directory: ${REMOTE_RELEASE_DIR}"
          echo "Local build/web listing, if present:"
          ls -la build || true
          ls -la build/web || true
          echo "Disk usage:"
          df -h || true

  package-android:
    name: Package Android app
    runs-on: ubuntu-latest
    needs: deploy-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print Android packaging context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          echo "Production signing expected: ${{ github.ref_name == 'main' }}"

      - name: Patch environment file
        env:
          BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euxo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          java -version
          flutter --version
          flutter pub get

      - name: Decode production Android signing keystore
        if: github.ref_name == 'main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euxo pipefail
          echo "Checking Android signing secrets"
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "ANDROID_KEYSTORE_BASE64 is missing" && exit 1)
          test -n "$ANDROID_KEYSTORE_PASSWORD" || (echo "ANDROID_KEYSTORE_PASSWORD is missing" && exit 1)
          test -n "$ANDROID_KEY_ALIAS" || (echo "ANDROID_KEY_ALIAS is missing" && exit 1)
          echo "Decoding Android upload keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -l android/app/upload-keystore.jks
          {
            echo "ANDROID_KEYSTORE_PATH=upload-keystore.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Android signing environment configured"

      - name: Build staging debug APK
        if: github.ref_name == 'staging'
        run: |
          set -euxo pipefail
          flutter build apk --debug --dart-define=APP_ENV=staging
          ls -lh build/app/outputs/flutter-apk/

      - name: Build production release APK
        if: github.ref_name == 'main'
        run: |
          set -euxo pipefail
          flutter build apk --release --dart-define=APP_ENV=production
          ls -lh build/app/outputs/flutter-apk/

      - name: Build production app bundle
        if: github.ref_name == 'main'
        run: |
          set -euxo pipefail
          flutter build appbundle --release --dart-define=APP_ENV=production
          ls -lh build/app/outputs/bundle/release/

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.ref_name }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Android packaging diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "Android packaging job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "Android output directories:"
          find build/app/outputs -maxdepth 4 -type f -print || true
          echo "Gradle reports:"
          find android -path '*reports*' -type f -print || true
          echo "Disk usage:"
          df -h || true

  package-ios:
    name: Package iOS app
    runs-on: macos-latest
    needs: deploy-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Print iOS packaging context
        run: |
          set -euxo pipefail
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Flutter version: ${FLUTTER_VERSION}"
          echo "App environment: ${APP_ENV}"
          sw_vers
          xcodebuild -version

      - name: Patch environment file
        env:
          BASE_DOMAIN: ${{ secrets.DOMAIN_NAME }}
        run: |
          set -euxo pipefail
          test -n "${BASE_DOMAIN}" || (echo "Missing required GitHub secret: DOMAIN_NAME" && exit 1)
          if [ "${APP_ENV}" = "production" ]; then
            ENV_FILE="env/production.env"
            API_BASE_URL="https://${BASE_DOMAIN}/api"
          elif [ "${APP_ENV}" = "staging" ]; then
            ENV_FILE="env/staging.env"
            API_BASE_URL="https://staging.${BASE_DOMAIN}/api"
          else
            echo "Skipping CI env patch for APP_ENV=${APP_ENV}"
            exit 0
          fi
          PLACEHOLDER="__API_BASE_URL__"
          export ENV_FILE API_BASE_URL PLACEHOLDER
          python3 - <<'PY'
          import os
          from pathlib import Path

          env_file = Path(os.environ['ENV_FILE'])
          placeholder = os.environ['PLACEHOLDER']
          api_base_url = os.environ['API_BASE_URL']
          content = env_file.read_text()
          if placeholder not in content:
              raise SystemExit(f'Placeholder {placeholder} not found in {env_file}')
          content = content.replace(placeholder, api_base_url)
          if placeholder in content:
              raise SystemExit(f'Placeholder replacement failed in {env_file}')
          env_file.write_text(content)
          PY
          echo "Patched ${ENV_FILE}:"
          cat "${ENV_FILE}"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Build staging iOS app without code signing
        if: github.ref_name == 'staging'
        run: |
          set -euxo pipefail
          flutter build ios --debug --no-codesign --dart-define=APP_ENV=staging
          ls -lh build/ios/iphoneos/

      - name: Build production iOS app without code signing
        if: github.ref_name == 'main'
        run: |
          set -euxo pipefail
          flutter build ios --release --no-codesign --dart-define=APP_ENV=production
          ls -lh build/ios/iphoneos/

      - name: Archive unsigned iOS app artifact
        run: |
          set -euxo pipefail
          cd build/ios/iphoneos
          zip -r ../ios-${{ github.ref_name }}-unsigned.zip Runner.app
          ls -lh ../ios-${{ github.ref_name }}-unsigned.zip

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ github.ref_name }}-unsigned
          path: build/ios/ios-${{ github.ref_name }}-unsigned.zip
          if-no-files-found: error

      - name: iOS packaging diagnostics on failure
        if: failure()
        run: |
          set +e
          echo "iOS packaging job failed."
          echo "Branch: ${{ github.ref_name }}"
          echo "App environment: ${APP_ENV}"
          echo "iOS build outputs:"
          find build/ios -maxdepth 4 -type f -print || true
          echo "Xcode version:"
          xcodebuild -version || true
          echo "Disk usage:"
          df -h || true
