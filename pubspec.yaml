name: mpc_pharma
description: MPC Pharma — logistics app for scanning, dispatch, and delivery.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  shared_preferences: ^2.5.3
  mobile_scanner: ^7.0.0
  geolocator: ^14.0.0
  permission_handler: ^12.0.0+1
  url_launcher: ^6.3.1
  signature: ^5.5.0
  vibration: ^3.1.3
  sms_autofill: ^2.4.1
  intl: ^0.20.2
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.1.0
  collection: ^1.19.1
  google_maps_flutter: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map/
