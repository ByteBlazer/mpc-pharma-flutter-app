<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MPC Pharma web application.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="MPC Pharma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MPC Pharma</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      opacity: 1;
      transition: opacity 200ms ease-out;
    }

    #splash .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    #splash.splash--removed {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 120px;
      height: 120px;
    }

    #splash p {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #5e86b9;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <div id="splash" aria-live="polite" aria-busy="true">
    <div class="splash-content">
      <img src="splash/app_icon.png" alt="MPC Pharma" width="120" height="120">
      <p>Please wait…</p>
    </div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
